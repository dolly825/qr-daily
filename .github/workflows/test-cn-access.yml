name: test-cn-access

on:
  workflow_dispatch:
    inputs:
      url1:
        description: '第一个网址'
        required: true
        type: string
      url2:
        description: '第二个网址'
        required: true
        type: string

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Test URLs (mobile UA)
        env:
          URL1: ${{ inputs.url1 }}
          URL2: ${{ inputs.url2 }}
        run: |
          MOBILE_UA="Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.0 Mobile/15E148 Safari/604.1"
          for url in "$URL1" "$URL2"; do
            echo "========== $url =========="
            curl -L -s -o /tmp/page.html \
              -A "$MOBILE_UA" \
              -H "Accept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8" \
              -H "Accept-Language: zh-CN,zh;q=0.9" \
              --max-time 30 \
              -w "http_code=%{http_code}\ntime_total=%{time_total}\nsize_download=%{size_download}\n" \
              "$url" || echo "curl 失败"
            echo "----- 页面前 500 字符 -----"
            head -c 500 /tmp/page.html || true
            echo
            echo "----- 可疑关键词 -----"
            grep -Eio "验证码|滑块|访问受限|forbidden|captcha|verify|登录|安全验证|微信|请在手机|移动端" /tmp/page.html | head -n 10 || true
            echo
          done
