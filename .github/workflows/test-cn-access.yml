name: Test Website Connection

on:
  workflow_dispatch   # 允许手动触发

jobs:
  test-connection:
    runs-on: ubuntu-latest
    steps:
      - name: Test with curl
        run: |
          echo "Fetching the URL..."
          curl -v -L "http://www.wap.cnyiot.com/nat/pay.aspx" -o page.html
          echo "--- Response Headers ---"
          head -n 20 page.html

      - name: Upload page.html
        uses: actions/upload-artifact@v4
        with:
          name: page
          path: page.html
